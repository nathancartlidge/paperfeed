[project]
name = "paperfeed"
version = "0.2.0"
description = "Python Driver for the Dolewa LX-D5"
requires-python = ">=3.12"
dependencies = [
    "bleak>=1.1.1",
    "numpy>=2.3.4",
    "tqdm>=4.67.1",
    "pillow>=12.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "notebook>=7.5.0",
    "requests>=2.32.5",
]

[project.scripts]
bt_detect = "paperfeed.driver.scan:scan_sync"
demo = "paperfeed.__main__:run_sync"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["paperfeed*"]
